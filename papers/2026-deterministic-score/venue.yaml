venue:
  name: ITP
  year: 2026
  official_url: https://itp-conference-2026.github.io/cfp.html
  source_checked_date: 2026-05-22
  conference_dates: 2026-07-26/2026-07-29
  location: Lisbon, Portugal
  format: LIPIcs
  latex_class: lipics-v2021
  latex_version: v2021.1.3
  paper_type: regular
  page_limit:
